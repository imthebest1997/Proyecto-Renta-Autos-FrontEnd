<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo Renta de Automoviles - Consultas</title>
    <link href="../../css/bootstrap-css/bootstrap.min.css" rel="stylesheet">  
    <link href="../../css/dashboard.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
  <header></header>      
  <div class="container-fluid">
    <div class="row">
      <nav></nav>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
          <h1 class="h2">Consultar Registro de Renta de Automoviles</h1>
        </div>
        
        <div class="container">
            <div class="row">        
              <div class="col-12">
                <div class="table-responsive mt-5">
                    <table class="table table-striped table-hover">
                      <thead>
                        <tr>
                          <th scope="col">#</th>
                          <th scope="col">Fecha de Inicio</th>
                          <th scope="col">Fecha de Fin</th>
                          <th scope="col">Automovil</th>
                          <th scope="col">Cliente</th>
                          <th scope="col">Responsable</th>
                          <th scope="col">Total</th>
                          <th></th>
                        </tr>
                      </thead>
                      <tbody id="tblaRegistroRenta">                              
                      </tbody>
                    </table>
                </div>    
              </div>
              
              <div class="btn-regresar mt-5 mb-5">
                <a href="renta-automoviles.html" class="btn btn-danger">Regresar</a>
              </div>   
            </div>
        </div>
      </main>
    </div>
  </div>
      
  <!-- Modal -->
  <div class="modal fade" id="mdMantenimiento" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Detalle de Mantenimientos</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3 row g-2">
            <div class="mt-3 col-3">
              <label for="txtNombreAuto" class="form-label"><b>Nombre del automovil:</b></label>
            </div>
            <div class="col-6">
              <input type="text" id="txtNombreAuto" value="" class="form-control" readonly>
            </div>
          </div>


          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">Nombre</th>
                <th scope="col">Descripción</th>
                <th scope="col"></th>
              </tr>
            </thead>
            <tbody id="tblaDetalleMantenimientos">
            </tbody>
          </table>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/sweetalert2.all.min.js"></script>
  <script src="../../js/jquery-3.6.0.min.js"></script>
  <script src="../../js/bootstrap-js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.28.0/dist/feather.min.js" integrity="sha384-uO3SXW5IuS1ZpFPKugNNWqTZRRglnUJK6UAZ/gxOX80nxEkN9NcGZTftn6RzhGWE" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js" integrity="sha384-zNy6FEbO50N+Cg5wap8IKA4M/ZnLJgzc6w2NqACZaK0u0FXfOWRRJOnQtpZun8ha" crossorigin="anonymous"></script>
  <script src="../../js/CRUD/list-renta.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script src="../../js/navbar-main.js"></script>
  <script>
    $(function(){
        document.getElementById("linkRentaAutos").classList = 'nav-link active';
    });
  </script>

</body>
</html>
