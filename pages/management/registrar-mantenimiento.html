<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Mantenimiento</title>
    <link href="../../css/bootstrap-css/bootstrap.min.css" rel="stylesheet">  
    <link href="../../css/dashboard.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

  <header></header>   

  <div class="container-fluid">
        <div class="row">
          <nav></nav>
      
          <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
              <h1 class="h2">Registrar Mantenimientos</h1>
            </div>
            
            <div class="container" id="modulo-inicial">
                <div class="row">
                    <div class="col-6">
                      <form action="">
                      <div class="mb-3">
                        <label for="txtAutomovil" class="form-label"><b>Automovil:</b></label>
                        <select name="txtAutomovil" id="txtAutomovil" class="form-select">
                        </select>
                      </div>

                      <div class="mb-3">
                            <label for="txtFechaInicioMantenimiento" class="form-label"><b>Fecha de Inicio:</b></label>
                            <input type="date" name="txtFechaInicioMantenimiento" id="txtFechaInicioMantenimiento" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="txtFechaFinMantenimiento" class="form-label"><b>Fecha de Fin:</b></label>
                            <input type="date" name="txtFechaFinMantenimiento" id="txtFechaFinMantenimiento" class="form-control">
                        </div>
                      </form>
                    </div>
                </div>

                <div class="alinear-end">
                  <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#listaDetalleMantenimiento">Agregar Detalles de Mantenimiento</button>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover">
                      <thead>
                        <tr>
                          <th scope="col">Nombre</th>
                          <th scope="col">Detalle de Mantenimiento</th>
                          <th scope="col"></th>
                        </tr>
                      </thead>
                      <tbody id="tblaMantenimiento">
                      </tbody>
                    </table>
                  </div>

                  <button class="btn btn-success" id="btnRegistrarMantenimiento">Registrar</button>

                <div class="btn-regresar m-4">
                  <a href="mantenimientos.html" class="btn btn-danger">Regresar</a>
                </div>


                      <!-- Modal -->
                      <div class="modal fade" id="listaDetalleMantenimiento" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                        <div class="modal-dialog modal-lg">
                          <div class="modal-content">
                            <div class="modal-header">
                              <h5 class="modal-title" id="exampleModalLabel">Registro de Detalle de Mantenimientos</h5>
                               <hr>
                              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                              <div class="mb-3">
                                <label for="txtNombreDetalleM" class="form-label"><b>Nombre:</b></label>
                                <input type="text" id="txtNombreDetalleM" name="txtNombreDetalleM" class="form-control">
                              </div>

                              <div class="mb-3">
                                <label for="txtDetalleM" class="form-label"><b>Detalle de Manteniemiento:</b></label>
                                <textarea name="txtDetalleM" id="txtDetalleM" cols="30" rows="5" class="form-control"></textarea>
                                <div id="alertCamposDetalleMModal"></div>
                              </div>


                            </div>
                            <div class="modal-footer">
                              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                              <button type="button" class="btn btn-primary" id="insertarDetalleMModal">Insertar Detalle de Mantenimiento</button>
                            </div>
                          </div>
                        </div>
                      </div>
            </div>
        </main>
    </div>
  </div>

  <script src="../../js/jquery-3.6.0.min.js"></script>      
  <script src="../../js/sweetalert2.all.min.js"></script>
  <script src="../../js/CRUD/registro-mantenimiento.js"></script>            
  <script src="../../js/bootstrap-js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.28.0/dist/feather.min.js" integrity="sha384-uO3SXW5IuS1ZpFPKugNNWqTZRRglnUJK6UAZ/gxOX80nxEkN9NcGZTftn6RzhGWE" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js" integrity="sha384-zNy6FEbO50N+Cg5wap8IKA4M/ZnLJgzc6w2NqACZaK0u0FXfOWRRJOnQtpZun8ha" crossorigin="anonymous"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script src="../../js/navbar-main.js"></script>
  <script>
    $(function(){
        document.getElementById("linkMantenimientos").classList = 'nav-link active';
    });
  </script>

</body>
</html>
