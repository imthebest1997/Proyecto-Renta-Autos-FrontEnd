<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo Renta - Registro</title>
    <link href="../../css/bootstrap-css/bootstrap.min.css" rel="stylesheet">  
    <link href="../../css/dashboard.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

  <header></header>   
    
  <div class="container-fluid">
        <div class="row">
          <nav></nav>
      
          <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
              <h1 class="h2">Registrar Renta de Autos</h1>
            </div>
            
            <div class="container" id="modulo-inicial">
                <div class="row">
                  <div class="col-6">
                    <form class="row g-3" method="POST">
                      <div class="mb-3 col-6">
                        <label for="txtAutomovilRenta" class="form-label"><b>Automovil:</b></label>
                        <select name="txtAutomovilRenta" id="txtAutomovilRenta" class="form-select">
                        </select>
                      </div>

                      <div class="mb-3 col-6">
                        <label for="txtEmpleadoRenta" class="form-label"><b>Empleado responsable:</b></label>
                        <select name="txtEmpleadoRenta" id="txtEmpleadoRenta" class="form-select">
                        </select>
                      </div>

                      <div class="mb-3 col-6">
                          <label for="txtClienteRenta" class="form-label"><b>Cliente:</b></label>
                          <select name="txtClienteRenta" id="txtClienteRenta" class="form-select">
                          </select>
                      </div>

                      <div class="mb-3 col-6">
                        <label for="txtPrecioDiaRenta" class="form-label"><b>Precio por dia:</b></label>
                        <input type="number" name="txtPrecioDiaRenta" id="txtPrecioDiaRenta" class="form-control" readonly>
                      </div>

                      <div class="mb-3 col-6">
                        <label for="txtFechaInicioRenta" class="form-label"><b>Fecha de Inicio:</b></label>
                        <input type="date" name="txtFechaInicioRenta" id="txtFechaInicioRenta" class="form-control">
                      </div>

                      <div class="mb-3 col-6">
                        <label for="txtFechaFinRenta" class="form-label"><b>Fecha de Fin:</b></label>
                        <input type="date" name="txtFechaFinRenta" id="txtFechaFinRenta" class="form-control">
                      </div>

                      <div class="mb-3 col-6">
                        <label for="txtTotalRenta" class="form-label"><b>Total:</b></label>
                        <input type="number" name="txtTotalRenta" id="txtTotalRenta" class="form-control" min="50" readonly>
                      </div>
                  </form>
                </div>

                <div class="col-6">
                    <div id="carouselImagenesRenta" class="carousel slide" data-bs-ride="carousel">
                      <div class="carousel-inner">
                        <div class="carousel-item active">
                          <div class="carousel-image">
                            <img src="../../images/renta de autos - 1.jpg" class="d-block w-100" alt="...">
                          </div>
                        </div>
                        <div class="carousel-item">
                          <img src="../../images/renta de autos - 2.jpg" class="d-block w-100" alt="...">
                        </div>
                        <div class="carousel-item">
                          <img src="../../images/renta de autos - 3.jpg" class="d-block w-100" alt="...">
                        </div>
                      </div>
                    </div>
                </div>
              </div>
              <button class="btn btn-success" id="btnRegistrarRenta">Registrar</button>

              <div class="btn-regresar m-4">
                <a href="renta-automoviles.html" class="btn btn-danger">Regresar</a>
              </div>
          </div>
      </main>
  </div>
</div>

  <script src="../../js/jquery-3.6.0.min.js"></script>      
  <script src="../../js/sweetalert2.all.min.js"></script>
  <script src="../../js/CRUD/registro-renta.js"></script>            
  <script src="../../js/bootstrap-js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.28.0/dist/feather.min.js" integrity="sha384-uO3SXW5IuS1ZpFPKugNNWqTZRRglnUJK6UAZ/gxOX80nxEkN9NcGZTftn6RzhGWE" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js" integrity="sha384-zNy6FEbO50N+Cg5wap8IKA4M/ZnLJgzc6w2NqACZaK0u0FXfOWRRJOnQtpZun8ha" crossorigin="anonymous"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script src="../../js/navbar-main.js"></script>
  <script>
    $(function(){
        document.getElementById("linkRentaAutos").classList = 'nav-link active';
    });
  </script>

</body>
</html>
