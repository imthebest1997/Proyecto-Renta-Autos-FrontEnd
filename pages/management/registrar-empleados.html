<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo Empleados - Registro</title>
    <link href="../../css/bootstrap-css/bootstrap.min.css" rel="stylesheet">  
    <link href="../../css/dashboard.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

  <header></header>   

  <div class="container-fluid">
        <div class="row">
          <nav></nav>
  
          <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
              <h1 class="h2">Registrar Empleados</h1>
            </div>
            
            <div class="container">
                <div class="row">
                    <div class="col-6">
                        <form class="row g-3">
                            <div class="col-md-6">
                              <label for="txtNombreEmpleado" class="form-label"><b>Nombre:</b></label>
                              <input type="text" class="form-control" id="txtNombreEmpleado" maxlength="40">
                            </div>
                            <div class="col-md-6">
                              <label for="txtCedulaEmpleado" class="form-label"><b>Cédula:</b></label>
                              <input type="text" class="form-control" id="txtCedulaEmpleado" minlength="10" maxlength="13">
                            </div>
                            <div class="col-md-6">
                              <label for="txtTelefonoEmpleado" class="form-label"><b>Telefono:</b></label>
                              <input type="text" class="form-control" id="txtTelefonoEmpleado" minlength="9" maxlength="9">
                            </div>
                            <div class="col-md-6">
                              <label for="txtCelularEmpleado" class="form-label"><b>Celular:</b></label>
                              <input type="text" class="form-control" id="txtCelularEmpleado" minlength="10" maxlength="10">
                            </div>

                            <div class="col-12">
                              <label for="txtCorreoElectronicoEmpleado" class="form-label"><b>Correo Electrónico:</b></label>
                              <input type="email" class="form-control" id="txtCorreoElectronicoEmpleado">
                            </div>
   
                            <div class="col-12">
                              <button type="button" class="btn btn-primary" id = "btnRegistrarEmpleado">Registrar</button>
                            </div>
                          </form>
                    </div>
    
                    <div class="col-6 image">
                        <img src="../../images/empleados.jpg" alt="">
                    </div>
                </div>

                <div class="btn-regresar">
                  <a href="empleados.html" class="btn btn-danger">Regresar</a>
                </div>
            </div>
        </main>
    </div>
  </div>
      
  <script src="../../js/bootstrap-js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.28.0/dist/feather.min.js" integrity="sha384-uO3SXW5IuS1ZpFPKugNNWqTZRRglnUJK6UAZ/gxOX80nxEkN9NcGZTftn6RzhGWE" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js" integrity="sha384-zNy6FEbO50N+Cg5wap8IKA4M/ZnLJgzc6w2NqACZaK0u0FXfOWRRJOnQtpZun8ha" crossorigin="anonymous"></script>
  <script src="../../js/jquery-3.6.0.min.js"></script>
  <script src="../../js/CRUD/registro-empleados.js"></script>
  <script src="../../js/sweetalert2.all.min.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script src="../../js/navbar-main.js"></script>
  <script>
    $(function(){
        document.getElementById("linkEmpleados").classList = 'nav-link active';
    });
  </script>


</body>
</html>
