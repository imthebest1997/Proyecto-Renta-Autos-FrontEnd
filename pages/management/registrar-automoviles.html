<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo Automoviles - Registro</title>
    <link href="../../css/bootstrap-css/bootstrap.min.css" rel="stylesheet">  
    <link href="../../css/dashboard.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body>

  <header></header>      
  <div class="container-fluid">
        <div class="row">
          <nav></nav>
      
          <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
              <h1 class="h2">Registrar Automoviles</h1>
            </div>
            
            <div class="container">
                <div class="row">
                  <div class="col-6">
                    <form method="POST" class="row g-2">
                      <div class="mb-3 col-6">
                        <label for="txtMarcaAutomovil" class="form-label"><b>Marca: </b></label>
                        <input type="text" class="form-control" id="txtMarcaAutomovil" required>
                      </div>

                      <div class="mb-3 col-6">
                        <label for="txtTipoAuto" class="form-label"><b>Tipo de automovil: </b></label>
                        <select name="txtTipoAuto" id="txtTipoAuto" class="form-control">
                          <option value="deportivo" selected>Deportivo</option>
                          <option value="4x4">4x4</option>
                          <option value="buseta">Buseta</option>
                          <option value="sedan">Sedan</option>
                          <option value="rally">Rally</option>
                          <option value="rally">W</option>
                        </select>
                      </div>

                      <div class="mb-3 col-4">
                        <label for="txtNumPlacaAutomovil" class="form-label"><b># de placa: </b></label>
                        <input type="text" class="form-control" id="txtNumPlacaAutomovil" required>
                      </div>

                      <div class="mb-3 col-4">
                        <label for="txtColorAutomovil" class="form-label"><b>Color: </b></label>
                        <input type="text" class="form-control" id="txtColorAutomovil" required>
                      </div>

                      <div class="mb-3 col-4">
                        <label for="txtPrecioDiaRentaAutomovil" class="form-label"><b>Precio de renta por dia ($): </b></label>
                        <input type="number" class="form-control" id="txtPrecioDiaRentaAutomovil" min="50.00" value="50" step="any" required>
                      </div>
                      
                    </form>
                    <div class="alinear-end">
                      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#listaAccesorios">Agregar Accesorios</button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover">
                          <thead>
                            <tr>
                              <th scope="col">Nombre</th>
                              <th scope="col"></th>
                            </tr>
                          </thead>
                          <tbody id="tblaAccesorios">
                          </tbody>
                        </table>
                      </div>

                    <div class="alinear-end">
                      <button type="button" class="btn btn-success" id="btnRegistrarAuto">Registrar automovil</button>

                    </div>

                      <!-- Modal -->
                      <div class="modal fade" id="listaAccesorios" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                        <div class="modal-dialog">
                          <div class="modal-content">
                            <div class="modal-header">
                              <h5 class="modal-title" id="exampleModalLabel">Registro de Accesorios</h5>
                               <hr>
                              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                              <div class="mb-3">
                                <label for="txtNombreAccesorio" class="form-label"><b>Nombre:</b></label>
                                <input type="text" id="txtNombreAccesorio" name="txtNombreAccesorio" class="form-control">
                                <div id="alertCampoAccesorioModal"></div>

                              </div>
                            </div>
                            <div class="modal-footer">
                              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                              <button type="button" class="btn btn-primary" id="insertarAccesorioModal">Insertar Accesorio</button>
                            </div>
                          </div>
                        </div>
                      </div>

                  </div>

                  <div class="col-6 image">
                    <img src="../../images/autos/camioneta-hilux.png" alt="">
                  </div>
                </div>
                <div class="btn-regresar">
                  <a href="automoviles.html" class="btn btn-danger">Regresar</a>
                </div>
              </div>
            </main>
          </div>
  </div>

  <script src="../../js/jquery-3.6.0.min.js"></script>      
  <script src="../../js/bootstrap-js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.28.0/dist/feather.min.js" integrity="sha384-uO3SXW5IuS1ZpFPKugNNWqTZRRglnUJK6UAZ/gxOX80nxEkN9NcGZTftn6RzhGWE" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.4/dist/Chart.min.js" integrity="sha384-zNy6FEbO50N+Cg5wap8IKA4M/ZnLJgzc6w2NqACZaK0u0FXfOWRRJOnQtpZun8ha" crossorigin="anonymous"></script>
  <script src="../../js/CRUD/registro-auto.js"></script>
  <script src="../../js/sweetalert2.all.min.js"></script>
  <script cript type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script src="../../js/navbar-main.js"></script>
  <script>
    $(function(){
        document.getElementById("linkMantenimientos").classList = 'nav-link active';
    });
  </script>
</body>
</html>
